<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Break list du soir - Barrière Casino Bordeaux</title>
  <link rel="stylesheet" href="../shared/barriere.css"/>
  <link rel="stylesheet" href="break_list.css"/>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">
  <span id="theme-icon">☀️</span> <span id="theme-label">Mode jour</span>
</button>

<div class="app">
  <a href="../index.html" class="back">← Accueil</a>

  <div class="hdr">
    <span class="hdr-logo">Barrière Casino · Bordeaux</span>
    <div class="hdr-title bl-switch" id="bl-switch" role="tablist" aria-label="Partie">
      <button type="button" role="tab" data-part="breaklist" class="on" aria-selected="true" onclick="showPart('breaklist')">Break list</button>
      <i>|</i>
      <button type="button" role="tab" data-part="departs" aria-selected="false" onclick="showPart('departs')">Départs</button>
    </div>
  </div>

  <!-- ══ Break list : la soirée, les présents, l'impression de la feuille ══ -->
  <section class="bl-part bl-view bl-no-print" id="part-breaklist">

    <div class="card bl-card">
      <div class="sec">Soirée</div>
      <div class="period-row">
        <div class="fg fg-date">
          <label class="fl">Date</label>
          <div class="bl-date">
            <button class="btn btn-ghost btn-icon" type="button" title="Jour précédent" aria-label="Jour précédent" onclick="shiftDay(-1)"><i class="ico ico-chev-l"></i></button>
            <input type="number" id="inp-day" min="1" max="31" onchange="onDateChange()"/>
            <select id="sel-mon" onchange="onDateChange()"></select>
            <input type="number" id="inp-year" min="2020" max="2099" onchange="onDateChange()"/>
            <button class="btn btn-ghost btn-icon" type="button" title="Jour suivant" aria-label="Jour suivant" onclick="shiftDay(1)"><i class="ico ico-chev-r"></i></button>
          </div>
        </div>
        <div class="period-actions">
          <button class="btn btn-ghost" id="btn-today" onclick="goToday()">Aujourd'hui</button>
          <button class="btn btn-ghost" id="btn-print" onclick="printBreakList()"><i class="ico ico-print"></i> Imprimer la break list</button>
        </div>
      </div>
      <div class="bl-muted" id="plan-info" style="margin-top:12px"></div>
      <div class="bl-muted" id="plan-maj" style="margin-top:4px"></div>
    </div>

    <div class="card bl-card">
      <div class="sec">Présents ce soir</div>
      <div class="bl-eff" id="count-out" hidden></div>
      <div id="presents-out"></div>
      <div class="bl-add" id="add-box" hidden>
        <div class="fg"><label class="fl">Ajouter un présent</label><select id="add-person"></select></div>
        <div class="fg sm"><label class="fl">Horaire</label><select id="add-code"></select></div>
        <button class="btn btn-ghost" onclick="addPresent()"><i class="ico ico-plus"></i> Ajouter</button>
      </div>
    </div>
  </section>

  <!-- ══ Départs : extraction Octime et répartition ══ -->
  <section class="bl-part bl-view bl-no-print" id="part-departs" hidden>

    <div class="bl-muted bl-card" id="dep-date" style="margin:-8px 0 16px"></div>

    <div class="card bl-card">
      <div class="sec">Extraction Octime</div>
      <div class="bl-drop">
        <textarea id="octime-paste" placeholder="Collez ici l'extraction Octime (Ctrl+V), ou choisissez un fichier" spellcheck="false" oninput="onOctimePaste()"></textarea>
        <div class="bl-drop-actions">
          <button class="btn btn-ghost" onclick="document.getElementById('octime-file').click()"><i class="ico ico-plus"></i> Choisir un fichier</button>
          <input type="file" id="octime-file" accept=".csv,.tsv,.txt,.xlsx,.xls" hidden onchange="onOctimeFile(this)"/>
          <button class="btn btn-ghost" id="btn-octime-clear" onclick="clearOctime()" hidden>Effacer l'extraction</button>
          <span class="bl-status" id="octime-status"></span>
        </div>
      </div>
      <div id="unmatched-out" style="margin-top:16px"></div>
    </div>

    <div class="card bl-card">
      <div class="sec">Répartition</div>
      <div class="bl-opts">
        <div class="fg"><label class="fl">Stackers</label><input type="number" id="opt-stackers" min="0" max="12" onchange="renderRepartition()"/></div>
        <div class="fg"><label class="fl">Compteurs</label><input type="number" id="opt-compteurs" min="0" max="10" onchange="renderRepartition()"/></div>
        <div class="fg"><label class="fl">Cartes</label><input type="number" id="opt-cartes" min="0" max="10" onchange="renderRepartition()"/></div>
        <label class="chk"><input type="checkbox" id="opt-salle" onchange="renderRepartition()"/> Salle (1 chef)</label>
        <button class="btn btn-ghost bl-opts-print" id="btn-print-dep" onclick="printDeparts()" disabled><i class="ico ico-print"></i> Imprimer les départs</button>
      </div>
      <div id="rep-out"></div>
    </div>
  </section>

  <!-- ══ Feuilles imprimées : break list (recto et verso) et départs ══ -->
  <div id="bl-print" hidden></div>
  <div id="dep-print"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/barriere.js"></script>
<script src="../shared/supabase.js"></script>
<script src="../shared/auth.js"></script>
<script src="break_list_core.js"></script>
<script src="break_list_common.js"></script>
<script src="break_list.js"></script>
<script>AUTH.guard({ loginUrl: '../login.html', panel: 'break-list' }).then(function (u) { if (u) init(); });</script>
</body>
</html>
