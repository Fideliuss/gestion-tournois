<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calcul des gains — Ultimate Texas Hold'em — Barrière Casino Bordeaux</title>
  <link rel="stylesheet" href="../../shared/barriere.css" />
  <link rel="stylesheet" href="../training.css" />
  <link rel="stylesheet" href="uth.css" />
  <style>
    .app { padding: 64px 20px 80px; display: flex; flex-direction: column; align-items: center; }
    .hdr { margin-bottom: 40px; text-align: center; }
  </style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">
  <span id="theme-icon">☀️</span> <span id="theme-label">Mode jour</span>
</button>

<div class="app">
  <a href="uth_hub.html" class="back">← Ultimate Texas Hold'em</a>

  <div class="hdr">
    <span class="hdr-logo">Barrière Casino · Bordeaux</span>
    <div class="hdr-title">Calcul des <em>Gains</em></div>
  </div>

  <!-- ══ Entraînement (la session démarre dès l'ouverture : pas de niveaux, pas de chronomètre) ══ -->
  <div id="uc-training-screen" style="width:100%;max-width:640px">

    <div class="training-header">
      <span class="training-progress" id="uc-progress">Donne 1 / 10</span>
      <span class="training-score"    id="uc-score">Score : 0 / 0</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="uc-progress-fill" style="width:0%"></div>
    </div>

    <!-- Ce que fait le joueur, puis le tapis : banque, board, cases de mises (jetons) et joueur.
         Un clic sur une mise ouvre, à côté des jetons, la fenêtre de réponse : je paie / je laisse / je ramasse -->
    <div class="uc-situation" id="uc-situation"></div>
    <div class="uc-felt" id="uc-felt"></div>
    <div class="uc-hint" id="uc-hint"></div>

    <button class="btn btn-gold uth-next" id="uc-validate-btn" style="padding:12px 28px;font-size:13px" onclick="ucValidate()" disabled>Valider</button>

    <div class="feedback-bar empty" id="uc-feedback"></div>
    <div class="uc-detail" id="uc-detail"></div>
    <div class="uc-jackpot" id="uc-jackpot" style="display:none"></div>
    <button class="btn btn-gold uth-next" id="uc-next-btn" style="display:none;padding:12px 28px;font-size:13px" onclick="ucNext()">Suivant →</button>
  </div>

  <!-- ══ Résumé ══ -->
  <div id="uc-summary-screen" style="display:none">
    <div class="session-summary">
      <div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;
                  font-family:var(--f-ui);color:var(--text-muted);margin-bottom:12px">Calcul des gains</div>
      <div class="summary-score-big"   id="uc-summary-score">8/10</div>
      <div class="summary-score-label" id="uc-summary-pct">80%</div>
      <div class="summary-verdict"     id="uc-summary-verdict">Excellent !</div>
      <div class="summary-actions">
        <button class="btn btn-gold" onclick="ucRestart()" style="padding:12px 28px;font-size:13px">↺ Rejouer</button>
        <a href="uth_hub.html" class="btn btn-ghost" style="padding:12px 28px;font-size:13px;text-decoration:none">← Ultimate Texas Hold'em</a>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../shared/barriere.js"></script>
<script src="../../shared/supabase.js"></script>
<script src="../../shared/auth.js"></script>
<script src="uth_engine.js"></script>
<script src="uth_ui.js"></script>
<script src="uth_gains.js"></script>
<script>
AUTH.guard({ loginUrl: '../../login.html', panel: 'training' }).then(function(user) {
  if (!user) return;
  initUthGains();
});
</script>
</body>
</html>
