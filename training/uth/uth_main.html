<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meilleure main — Ultimate Texas Hold'em — Barrière Casino Bordeaux</title>
  <link rel="stylesheet" href="../../shared/barriere.css" />
  <link rel="stylesheet" href="../training.css" />
  <link rel="stylesheet" href="uth.css" />
  <style>
    .app { padding: 64px 20px 80px; display: flex; flex-direction: column; align-items: center; }
    .hdr { margin-bottom: 40px; text-align: center; }
  </style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">
  <span id="theme-icon">☀️</span> <span id="theme-label">Mode jour</span>
</button>

<div class="app">
  <a href="uth_hub.html" class="back">← Ultimate Texas Hold'em</a>

  <div class="hdr">
    <span class="hdr-logo">Barrière Casino · Bordeaux</span>
    <div class="hdr-title">Meilleure <em>Main</em></div>
  </div>

  <!-- ══ Sélection de niveau ══ -->
  <div id="um-level-screen" style="width:100%;max-width:480px">
    <div style="font-size:13px;color:var(--text-dim);text-align:center;margin-bottom:24px;font-family:var(--f-ui)">
      Choisissez votre niveau — pas de chronomètre, prenez le temps de réfléchir
    </div>
    <div class="level-grid">
      <div class="level-card" onclick="startUthMain('facile')">
        <div class="level-name facile">Facile</div>
        <div class="level-timer">5</div>
        <div class="level-unit">cartes</div>
      </div>
      <div class="level-card" onclick="startUthMain('medium')">
        <div class="level-name medium">Médium</div>
        <div class="level-timer">7</div>
        <div class="level-unit">cartes</div>
      </div>
      <div class="level-card" onclick="startUthMain('expert')">
        <div class="level-name expert">Expert</div>
        <div class="level-timer">7</div>
        <div class="level-unit">cartes + pièges</div>
      </div>
    </div>
  </div>

  <!-- ══ Entraînement ══ -->
  <div id="um-training-screen" style="display:none;width:100%;max-width:640px">

    <div class="training-header">
      <span class="training-progress" id="um-progress">Question 1 / 10</span>
      <span class="training-score"    id="um-score">Score : 0 / 0</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="um-progress-fill" style="width:0%"></div>
    </div>

    <div class="uth-table" id="um-table"></div>

    <div class="answer-question" id="um-question" style="margin-bottom:14px"></div>
    <div class="uth-answers" id="um-answers"></div>

    <div class="feedback-bar empty" id="um-feedback"></div>
    <button class="btn btn-gold uth-next" id="um-next-btn" style="display:none;padding:12px 28px;font-size:13px" onclick="umNext()">Suivant →</button>
  </div>

  <!-- ══ Résumé ══ -->
  <div id="um-summary-screen" style="display:none">
    <div class="session-summary">
      <div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;
                  font-family:var(--f-ui);color:var(--text-muted);margin-bottom:12px"
           id="um-summary-level"></div>
      <div class="summary-score-big"   id="um-summary-score">8/10</div>
      <div class="summary-score-label" id="um-summary-pct">80%</div>
      <div class="summary-verdict"     id="um-summary-verdict">Excellent !</div>
      <div class="summary-actions">
        <button class="btn btn-gold" onclick="umRestart()" style="padding:12px 28px;font-size:13px">↺ Rejouer</button>
        <a href="uth_hub.html" class="btn btn-ghost" style="padding:12px 28px;font-size:13px;text-decoration:none">← Ultimate Texas Hold'em</a>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../shared/barriere.js"></script>
<script src="../../shared/supabase.js"></script>
<script src="../../shared/auth.js"></script>
<script src="uth_engine.js"></script>
<script src="uth_ui.js"></script>
<script src="uth_main.js"></script>
<script>
AUTH.guard({ loginUrl: '../../login.html', panel: 'training' }).then(function(user) {
  if (!user) return;
  initUthMain();
});
</script>
</body>
</html>
