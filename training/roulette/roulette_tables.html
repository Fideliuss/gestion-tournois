<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training Roulette Tables — Barrière Casino Bordeaux</title>
  <link rel="stylesheet" href="../../shared/barriere.css" />
  <link rel="stylesheet" href="../training.css" />
  <link rel="stylesheet" href="roulette.css" />
  <style>
    .app {
      padding: 64px 20px 80px;
      display: flex; flex-direction: column; align-items: center;
    }
    .hdr { margin-bottom: 40px; text-align: center; }
  </style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">
  <span id="theme-icon">☀️</span> <span id="theme-label">Mode jour</span>
</button>

<div class="app">
  <a href="roulette_hub.html" class="back">← Roulette</a>

  <div class="hdr">
    <span class="hdr-logo">Barrière Casino · Bordeaux</span>
    <div class="hdr-title">Roulette <em>Tables</em></div>
  </div>

  <!-- ══ Choix de la table ══ -->
  <div id="tb-choice-screen" style="width:100%;max-width:560px">
    <div style="font-size:13px;color:var(--text-dim);text-align:center;margin-bottom:24px;font-family:var(--f-ui)">
      Choisissez la table à réviser
    </div>
    <div class="chipval-grid" id="tb-choice-grid"></div>
  </div>

  <!-- ══ Écran entraînement ══ -->
  <div id="tb-training-screen" style="display:none;width:100%;max-width:480px">

    <div class="training-header">
      <span class="training-progress" id="tb-progress">Carte 1 / 20</span>
      <span class="training-score"    id="tb-score">Score : 0 / 0</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="tb-progress-fill" style="width:0%"></div>
    </div>

    <div class="tb-stopwatch-wrap">
      <span class="tb-stopwatch-label">Temps — table <span id="tb-table-badge">× 35</span></span>
      <span class="tb-stopwatch-value" id="tb-stopwatch">0:00.0</span>
    </div>

    <div class="tb-card-wrap">
      <div class="tb-card" id="tb-card">
        <div class="tb-face tb-face-front">
          <div class="tb-question" id="tb-question">35 × 7</div>
          <div class="tb-answer-row">
            <input type="number" id="tb-answer-input" inputmode="numeric"
                   onkeydown="if(event.key==='Enter')submitTables()" />
            <button class="btn btn-gold" id="tb-submit-btn" onclick="submitTables()"
                    style="padding:10px 16px;font-size:13px">→</button>
          </div>
        </div>
        <div class="tb-face tb-face-back">
          <div class="tb-back-answer" id="tb-back-answer">245</div>
          <div class="tb-back-detail" id="tb-back-detail">✓ Correct</div>
        </div>
      </div>
    </div>

  </div>

  <!-- ══ Résumé ══ -->
  <div id="tb-summary-screen" style="display:none">
    <div class="session-summary">
      <div class="tb-summary-time" id="tb-summary-time">0:00.0</div>
      <div class="tb-summary-time-label">Temps — table <span id="tb-summary-table">× 35</span></div>
      <div class="summary-score-big"   id="tb-summary-score">18/20</div>
      <div class="summary-verdict"     id="tb-summary-verdict">Bien</div>
      <div class="summary-actions">
        <button class="btn btn-gold"  onclick="restartTables()"
                style="padding:12px 28px;font-size:13px">↺ Rejouer</button>
        <a href="roulette_hub.html" class="btn btn-ghost"
           style="padding:12px 28px;font-size:13px;text-decoration:none">← Roulette</a>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../shared/barriere.js"></script>
<script src="../../shared/supabase.js"></script>
<script src="../../shared/auth.js"></script>
<script src="roulette_tables.js"></script>
<script>
AUTH.guard({ loginUrl: '../../login.html', panel: 'training' }).then(function(user) {
  if (!user) return;
  initTables();
});
</script>
</body>
</html>
