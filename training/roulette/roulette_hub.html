<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training Roulette — Barrière Casino Bordeaux</title>
  <link rel="stylesheet" href="../../shared/barriere.css" />
  <link rel="stylesheet" href="../training.css" />
  <style>
    .app { padding: 64px 20px 80px; }
    .hdr { margin-bottom: 52px; }
    .footer { margin-top: 52px; text-align: center; font-size: 10px; letter-spacing: .14em; color: var(--text-muted); }
  </style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">
  <span id="theme-icon">☀️</span> <span id="theme-label">Mode jour</span>
</button>

<div class="app">
  <a href="../training.html" class="back">← Training</a>

  <div class="hdr">
    <span class="hdr-logo">Barrière Casino · Bordeaux</span>
    <div class="hdr-title">Training <em>Roulette</em></div>
  </div>

  <div class="grid">

    <a href="roulette_paiement.html" class="tool-card">
      <div class="tool-badge picto" data-icon="roulette"></div>
      <div class="tool-name">Calcul <em>Paiement</em></div>
    </a>

    <a href="roulette_conversion.html" class="tool-card c-jean">
      <div class="tool-badge picto" data-icon="chip"></div>
      <div class="tool-name">Conversion <em>Pièces</em></div>
    </a>

    <div class="tool-card c-cobalt disabled">
      <div class="tool-badge picto" data-icon="pen"></div>
      <div class="tool-name">Ordre <em>Paiement</em></div>
      <div class="tool-soon">Bientôt disponible</div>
    </div>

    <a href="roulette_pointage.html" class="tool-card c-teal">
      <div class="tool-badge picto" data-icon="magnifier"></div>
      <div class="tool-name">Pointage <em>Numéro</em></div>
    </a>

    <a href="roulette_couleur.html" class="tool-card c-cognac">
      <div class="tool-badge picto" data-icon="circle"></div>
      <div class="tool-name">Couleur <em>Numéro</em></div>
    </a>

    <a href="roulette_tables.html" class="tool-card c-sauterne">
      <div class="tool-badge" style="font-family:var(--f-display);font-weight:700;font-style:italic;color:rgb(var(--accent));">✕</div>
      <div class="tool-name">Tables <em>Multiplication</em></div>
    </a>

  </div>

  <div class="footer">Barrière Casino Bordeaux · Training Roulette</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../shared/barriere.js"></script>
<script src="../../shared/supabase.js"></script>
<script src="../../shared/auth.js"></script>
<script>AUTH.guard({ loginUrl: '../../login.html', panel: 'training' });</script>
</body>
</html>
